[package]
name = "mongoscope"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { version = "0.13", features = ["canvas", "tokio", "lazy"] }
nutype = { version = "0.5", features = ["serde"] }
indexmap = { version = "2", features = ["serde"] }
tokio = { version = "1", features = ["time", "rt-multi-thread", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mongod-proxy = { git = "ssh://git@github.com/jeroenvervaeke/mongod-proxy.git" }
bson = "2"
futures = "0.3"
tower-layer = "0.3"
tower-service = "0.3"
rmcp = { version = "1.7", features = ["macros", "server", "transport-io", "schemars", "transport-streamable-http-server"] }
axum = { version = "0.8" }
schemars = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
