[package]
name = "mongoscope"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/mongodb-labs/mongoscope"
authors = ["MongoDB Labs"]
license = "MIT"

[package.metadata.wix]
upgrade-guid = "A8882CF4-CF2C-4500-91C7-CDD6AFB25778"
path-guid = "DCCFB98F-DAA9-4E0B-A70A-02444D55F421"
license = false
eula = false

[dependencies]
iced = { version = "0.13", features = ["canvas", "tokio", "lazy"] }
nutype = { version = "0.5", features = ["serde"] }
indexmap = { version = "2", features = ["serde"] }
tokio = { version = "1", features = ["time", "rt-multi-thread", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mongod-proxy = { git = "https://github.com/jeroenvervaeke/mongod-proxy.git" }
bson = "2"
futures = "0.3"
tower-layer = "0.3"
tower-service = "0.3"
rmcp = { version = "1.7", features = ["macros", "server", "transport-io", "schemars", "transport-streamable-http-server"] }
axum = { version = "0.8" }
schemars = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
